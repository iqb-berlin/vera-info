              - href: didHR/intro/feedback.qmd
                text: Rückmeldung
              - didHR/intro/how-to-use.qmd
          - section: "VERA-3 Deutsch"
            href: didHR/v3_de/index.qmd
            contents:
              - section: "Lesen"
                href: didHR/v3_de/lesen/index.qmd
                contents:
                  - href: didHR/v3_de/lesen/material.qmd
                    text: Material
              - section: "Sprache"
